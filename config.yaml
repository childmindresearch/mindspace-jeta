# MindSpace-CLIP: Contrastive Projection Model Configuration (Free-Text to PCA Alignment)

dataset:
  train_csv_path: "./data/train_data.csv"
  inference_csv_path: "./data/eval_data.csv"
  text_column: "journal_entry"
  pca_columns:
    - "PCA_1"
    - "PCA_2"
    - "PCA_3"
    - "PCA_4"
    - "PCA_5"

text_encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_seq_length: 256
  text_input_dim: null  # Set to null for auto-detection (e.g., 384 for MiniLM, 1024 for BGE-Large)

model_architecture:
  shared_dim: 16
  text_head_hidden_dims:
    - 128
  text_head_dropout: 0.3
  pca_head_hidden_dims:
    - 32
  initial_temperature: 0.07

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.01
  epochs: 25
  train_split: 0.8
  seed: 42

paths:
  output_dir: "./outputs"
  logs_dir: "./outputs/logs"
  model_checkpoint: "./outputs/contrastive_model.pt"
  embeddings_output: "./outputs/projected_embeddings.pt"

optuna:
  n_trials: 25
  timeout: null
  best_config_path: "./config_best.yaml"

