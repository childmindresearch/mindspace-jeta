dataset:
  train_csv_path: ./data/mdes_train.csv
  inference_csv_path: ./data/mdes_test.csv
  text_column: prompt_response
  pca_columns:
  - Detailed Task Focus
  - Intrusive Distraction
  - Episodic Social Cognition
  - Future Problem-Solving
  - Sensory Engagement
  sample_query_pca:
  - 1.5
  - -1.0
  - 0.5
  - 0.0
  - 0.5
text_encoder:
  model_name: BAAI/bge-large-en-v1.5
  max_seq_length: 176
  text_input_dim: 1024
model_architecture:
  shared_dim: 64
  text_head_hidden_dims:
  - 128
  text_head_dropout: 0.2
  pca_head_hidden_dims:
  - 32
  initial_temperature: 0.14583991723477055
  use_rff_expansion: true
  rff_dim: 128
  use_swiglu_residual: true
training:
  batch_size: 16
  learning_rate: 0.007134118629780365
  weight_decay: 0.01880555616728355
  epochs: 25
  train_split: 0.8
  seed: 42
  loss_type: siglip
  auxiliary_loss_weight: 0.5
  soft_target_sigma: 1.0
paths:
  output_dir: ./outputs
  logs_dir: ./outputs/logs
  model_checkpoint: ./outputs/contrastive_model.pt
  embeddings_output: ./outputs/projected_embeddings.pt
optuna:
  n_trials: 25
  timeout: null
  best_config_path: ./config.yaml
  archive_dir: ./config_archive
