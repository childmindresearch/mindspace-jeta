dataset:
  train_csv_path: ./data/train_data.csv
  inference_csv_path: ./data/eval_data.csv
  text_column: journal_entry
  pca_columns:
  - PCA_1
  - PCA_2
  - PCA_3
  - PCA_4
  - PCA_5
  sample_query_pca:
  - 1.5
  - -1.0
  - 0.5
  - 0.0
  - 0.5
text_encoder:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  max_seq_length: 80
  text_input_dim: 384
model_architecture:
  shared_dim: 16
  text_head_hidden_dims:
  - 128
  - 64
  text_head_dropout: 0.4
  pca_head_hidden_dims:
  - 32
  - 16
  initial_temperature: 0.12106896936002161
training:
  batch_size: 16
  learning_rate: 0.0005611516415334506
  weight_decay: 0.07114476009343425
  epochs: 25
  train_split: 0.8
  seed: 42
paths:
  output_dir: ./outputs
  logs_dir: ./outputs/logs
  model_checkpoint: ./outputs/contrastive_model.pt
  embeddings_output: ./outputs/projected_embeddings.pt
optuna:
  n_trials: 25
  timeout: null
  best_config_path: ./config.yaml
  archive_dir: ./config_archive
